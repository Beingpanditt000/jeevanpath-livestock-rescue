{% extends "base.html" %}

{% block title %}Change Password — JEEVANPATH{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 40px auto;">

  <div class="card" style="box-shadow: var(--shadow-lg); padding: 30px 28px;">
    
    <div style="margin-bottom: 22px;">
      <h2 style="font-size: 1.4rem; font-weight: 800; color: #fff;">
        🔑 Change Account Password
      </h2>
      <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px;">
        Logged in as: <strong style="color: #fff;">{{ current_user.username }}</strong> (<span class="badge badge-normal">{{ current_user.role }}</span>)
      </p>
    </div>

    <form action="{{ url_for('change_password') }}" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div style="margin-bottom: 16px;">
        <label for="current_password" class="form-label">Current Password *</label>
        <input type="password" id="current_password" name="current_password" class="form-control" style="width: 100%;" placeholder="••••••••" required autofocus>
      </div>

      <div style="margin-bottom: 16px;">
        <label for="new_password" class="form-label">New Password (min 6 chars) *</label>
        <input type="password" id="new_password" name="new_password" class="form-control" style="width: 100%;" placeholder="••••••••" minlength="6" required>
      </div>

      <div style="margin-bottom: 22px;">
        <label for="confirm_password" class="form-label">Confirm New Password *</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" style="width: 100%;" placeholder="••••••••" minlength="6" required>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 10px;">
        <a href="{{ url_for('dashboard') }}" class="btn btn-outline">Cancel</a>
        <button type="submit" class="btn btn-primary" style="font-weight: 700;">
          Update Password
        </button>
      </div>
    </form>

  </div>

</div>
{% endblock %}
